<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1a1030" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clashCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#c9a7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background ambience -->
  <rect x="0" y="0" width="800" height="460" fill="url(#bgGlow)"/>

  <!-- faint ring behind arena -->
  <circle cx="400" cy="240" r="185" fill="none" stroke="#3d2f66" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="240" r="150" fill="none" stroke="#3d2f66" stroke-width="1" opacity="0.3"/>

  <!-- energy bolts converging to center, one per contender -->
  <g stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 400 130 L 385 190 L 405 205 L 395 240" stroke="#D97757" stroke-width="4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 235 330 L 300 300 L 290 270 L 380 245" stroke="#10A37F" stroke-width="4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 565 330 L 500 300 L 512 270 L 420 245" stroke="#6E4AFF" stroke-width="4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- clash core at center -->
  <circle cx="400" cy="240" r="60" fill="url(#clashCore)" filter="url(#bigBlur)">
    <animate attributeName="r" values="45;65;45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#softGlow)">
    <path d="M400 210 L410 232 L434 240 L410 248 L400 270 L390 248 L366 240 L390 232 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="rotate" from="0 400 240" to="360 400 240" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Claude / Anthropic — top -->
  <g filter="url(#softGlow)">
    <circle cx="400" cy="95" r="55" fill="#0f0f14" stroke="#D97757" stroke-width="2.5"/>
    <g transform="translate(365,60) scale(4.375)" fill="#D97757">
      <path fill-rule="evenodd" d="M9.218 2h2.402L16 12.987h-2.402zM4.379 2h2.512l4.38 10.987H8.82l-.895-2.308h-4.58l-.896 2.307H0L4.38 2.001zm2.755 6.64L5.635 4.777 4.137 8.64z"/>
    </g>
  </g>
  <text x="400" y="175" text-anchor="middle" fill="#D97757" font-family="Fira Code, monospace" font-size="15" letter-spacing="2">CLAUDE</text>

  <!-- Codex / OpenAI — bottom left -->
  <g filter="url(#softGlow)">
    <circle cx="195" cy="360" r="55" fill="#0f0f14" stroke="#10A37F" stroke-width="2.5"/>
    <g transform="translate(160,325) scale(2.9167)" fill="#10A37F">
      <path d="M22.282 9.821a5.985 5.985 0 00-.516-4.91 6.046 6.046 0 00-6.51-2.9A6.065 6.065 0 004.981 4.18a5.985 5.985 0 00-3.998 2.9 6.046 6.046 0 00.743 7.097 5.98 5.98 0 00.51 4.911 6.051 6.051 0 006.515 2.9A5.985 5.985 0 0013.26 24a6.056 6.056 0 005.772-4.206 5.99 5.99 0 003.997-2.9 6.056 6.056 0 00-.747-7.073zM13.26 22.43a4.476 4.476 0 01-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 00.392-.681v-6.737l2.02 1.168a.071.071 0 01.038.052v5.583a4.504 4.504 0 01-4.494 4.494zM3.6 18.304a4.47 4.47 0 01-.535-3.014l.142.085 4.783 2.759a.771.771 0 00.78 0l5.843-3.369v2.332a.08.08 0 01-.033.062L9.74 19.95a4.5 4.5 0 01-6.14-1.646zM2.34 7.896a4.485 4.485 0 012.366-1.973V11.6a.766.766 0 00.388.676l5.815 3.355-2.02 1.168a.076.076 0 01-.071 0l-4.83-2.786A4.504 4.504 0 012.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.076.076 0 01.071 0l4.83 2.791a4.494 4.494 0 01-.676 8.105v-5.678a.79.79 0 00-.407-.667zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 00-.785 0L9.409 9.23V6.897a.066.066 0 01.028-.061l4.83-2.787a4.5 4.5 0 016.68 4.66zm-12.64 4.135-2.02-1.164a.08.08 0 01-.038-.057V6.075a4.5 4.5 0 017.375-3.453l-.142.08L8.704 5.46a.795.795 0 00-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5Z"/>
    </g>
  </g>
  <text x="195" y="435" text-anchor="middle" fill="#10A37F" font-family="Fira Code, monospace" font-size="15" letter-spacing="2">CODEX</text>

  <!-- Qwen — bottom right -->
  <g filter="url(#softGlow)">
    <circle cx="605" cy="360" r="55" fill="#0f0f14" stroke="#6E4AFF" stroke-width="2.5"/>
    <g transform="translate(570,325) scale(2.9167)" fill="#6E4AFF">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M6.53042 6.68608L9.17005 2H12.3812L13.7691 4.5H19.13L20.7083 7.31197L19.3477 9.7339L22.0001 14.5L20.3545 17.163H17.8782L15.0001 22H11.7825L10.3675 19.5H5.00006L3.3466 16.6459L4.6256 14.4689L2 9.86996L3.75473 6.68608H6.53042ZM20.0001 7.4996L18.6902 9.66179L21.5001 14.5H18.9402L17.4018 12.0655L12.0001 21L10.7485 19H5.50011L6.50011 16.5H9.34471L4.19123 7.5H6.74874L9.50011 2.5L10.8446 4.96981L9.39145 7.4996H20.0001Z"/>
      <path d="M12.0001 15.5L9.00006 10H15.0001L12.0001 15.5Z"/>
    </g>
  </g>
  <text x="605" y="435" text-anchor="middle" fill="#6E4AFF" font-family="Fira Code, monospace" font-size="15" letter-spacing="2">QWEN</text>

  <!-- sparks -->
  <g fill="#ffffff">
    <circle cx="370" cy="210" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="430" cy="265" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="415" cy="205" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
